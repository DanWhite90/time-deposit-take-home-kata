openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  version: 1.0.0
  description: |
    Contract for the two time-deposit operations.

    Assumptions:
    - GET /time-deposits returns every stored plan. Each withdrawal uses the
      withdrawals table columns: id, timeDepositId, amount, and date.
    - POST /time-deposits/balances applies one month of interest to every stored
      plan and returns the plans afterwards. POST is used because the client does
      not send a replacement resource; the server runs the existing interest
      calculation and stores the new balances.
    - These are the only two operations. Invalid input is not described here.
servers:
  - url: http://localhost:8080
    description: Local application
tags:
  - name: time-deposits
    description: Retrieve time deposits and update their balances
paths:
  /time-deposits:
    get:
      tags:
        - time-deposits
      operationId: listTimeDeposits
      summary: Retrieve all time deposits
      responses:
        '200':
          description: Every time deposit, including its withdrawals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'
  /time-deposits/balances:
    post:
      tags:
        - time-deposits
      operationId: updateTimeDepositBalances
      summary: Update the balance of every time deposit
      description: >
        Loads every stored time deposit, applies the existing monthly interest
        rules, stores the new balances, and returns the plans.
      responses:
        '200':
          description: Time deposits after balances were updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'
components:
  schemas:
    TimeDeposit:
      type: object
      required:
        - id
        - planType
        - balance
        - days
        - withdrawals
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          example: basic
        balance:
          type: number
          format: double
          example: 1000.0
        days:
          type: integer
          format: int32
          example: 45
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required:
        - id
        - timeDepositId
        - amount
        - date
      properties:
        id:
          type: integer
          format: int32
          example: 9
        timeDepositId:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          format: double
          example: 25.5
        date:
          type: string
          format: date
          example: '2026-01-15'
